[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlfs"
version = "0.1.0"
description = "Machine learning from first principles: reference implementations for the interactive course"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ML from First Principles contributors" }]
keywords = ["machine-learning", "education", "from-scratch", "numpy", "scikit-learn"]
classifiers = [
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

# Fill these in once the repository has a public home.
# [project.urls]
# Homepage = "https://github.com/<owner>/ml-from-first-principles"
# Issues = "https://github.com/<owner>/ml-from-first-principles/issues"

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
dev = ["pytest>=7", "pytest-cov", "scikit-learn>=1.3", "shap>=0.44", "matplotlib>=3.7"]
torch = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
